name: school_connect_app
description: "School Attendance & Management System - Flutter Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  
  # Networking
  http: ^1.2.2
  
  # Firebase Auth + Google Sign-In + Apple Sign-In
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.4
  
  # Date/Time
  intl: ^0.19.0
  
  # File Picker
  file_picker: ^8.1.7
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # Animations & Illustrations
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2
  
  # Utils
  uuid: ^4.5.1
  # Export / share / print (teacher attendance reports)
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  csv: ^6.0.0
  excel: ^4.0.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
