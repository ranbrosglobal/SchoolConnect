<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#E8F5E9"/>
  
  <!-- Clipboard -->
  <rect x="50" y="60" width="100" height="120" rx="8" fill="#8D6E63"/>
  <rect x="55" y="65" width="90" height="110" rx="5" fill="#FFF"/>
  
  <!-- Clipboard clip -->
  <rect x="80" y="50" width="40" height="20" rx="5" fill="#5D4037"/>
  
  <!-- Checklist items -->
  <rect x="65" y="80" width="20" height="20" rx="3" fill="#4CAF50"/>
  <polyline points="69,90 74,95 81,85" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="65" y="110" width="20" height="20" rx="3" fill="#4CAF50"/>
  <polyline points="69,120 74,125 81,115" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="65" y="140" width="20" height="20" rx="3" fill="#FF9800"/>
  <line x1="70" y1="150" x2="80" y2="150" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Text lines -->
  <line x1="95" y1="90" x2="135" y2="90" stroke="#DDD" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="120" x2="135" y2="120" stroke="#DDD" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="150" x2="135" y2="150" stroke="#DDD" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pen -->
  <rect x="140" y="130" width="8" height="30" rx="2" fill="#FDD835" transform="rotate(30 144 145)"/>
  <polygon points="140,130 148,130 144,122" fill="#333" transform="rotate(30 144 126)"/>
  
  <!-- Stars -->
  <polygon points="160,50 163,60 173,60 165,66 168,76 160,70 152,76 155,66 147,60 157,60" fill="#FFC107"/>
  <polygon points="30,40 32,46 38,46 33,50 35,56 30,52 25,56 27,50 22,46 28,46" fill="#FFC107"/>
</svg>