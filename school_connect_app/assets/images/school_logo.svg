<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E3F2FD"/>
  
  <!-- School building -->
  <rect x="50" y="80" width="100" height="80" fill="#1976D2"/>
  
  <!-- Roof -->
  <polygon points="40,80 100,40 160,80" fill="#F57C00"/>
  
  <!-- Door -->
  <rect x="85" y="110" width="30" height="50" rx="5" fill="#5D4037"/>
  <circle cx="110" cy="135" r="3" fill="#FDD835"/>
  
  <!-- Windows -->
  <rect x="60" y="95" width="20" height="20" rx="2" fill="#BBDEFB"/>
  <rect x="120" y="95" width="20" height="20" rx="2" fill="#BBDEFB"/>
  
  <!-- Window cross -->
  <line x1="70" y1="95" x2="70" y2="115" stroke="#1976D2" stroke-width="2"/>
  <line x1="60" y1="105" x2="80" y2="105" stroke="#1976D2" stroke-width="2"/>
  <line x1="130" y1="95" x2="130" y2="115" stroke="#1976D2" stroke-width="2"/>
  <line x1="120" y1="105" x2="140" y2="105" stroke="#1976D2" stroke-width="2"/>
  
  <!-- Flag -->
  <line x1="100" y1="40" x2="100" y2="20" stroke="#333" stroke-width="3"/>
  <polygon points="100,20 120,25 100,30" fill="#F44336"/>
  
  <!-- Ground -->
  <ellipse cx="100" cy="165" rx="70" ry="10" fill="#4CAF50"/>
  
  <!-- Tree -->
  <rect x="150" y="130" width="8" height="35" fill="#5D4037"/>
  <circle cx="154" cy="120" r="18" fill="#4CAF50"/>
</svg>