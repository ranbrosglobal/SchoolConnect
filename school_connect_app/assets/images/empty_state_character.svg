<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#F5F5F5"/>
  
  <!-- Box -->
  <rect x="50" y="100" width="100" height="70" rx="5" fill="#BDBDBD"/>
  <rect x="55" y="105" width="90" height="60" rx="3" fill="#E0E0E0"/>
  
  <!-- Box flaps -->
  <polygon points="50,100 100,70 150,100" fill="#9E9E9E"/>
  <polygon points="50,100 100,80 150,100" fill="#BDBDBD"/>
  
  <!-- Question mark -->
  <text x="100" y="145" text-anchor="middle" fill="#9E9E9E" font-size="40" font-weight="bold">?</text>
  
  <!-- Confused character -->
  <circle cx="100" cy="50" r="25" fill="#FFCC80"/>
  
  <!-- Hair -->
  <path d="M75 45 Q75 25 100 25 Q125 25 125 45" fill="#795548"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="50" r="3" fill="#333"/>
  <circle cx="110" cy="50" r="3" fill="#333"/>
  
  <!-- Confused expression -->
  <path d="M90 60 Q100 55 110 60" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Sweat drop -->
  <path d="M120 40 Q125 35 120 30" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Question marks around -->
  <text x="40" y="50" fill="#BDBDBD" font-size="20" font-weight="bold">?</text>
  <text x="155" y="45" fill="#BDBDBD" font-size="16" font-weight="bold">?</text>
  <text x="30" y="130" fill="#BDBDBD" font-size="18" font-weight="bold">?</text>
  <text x="160" y="140" fill="#BDBDBD" font-size="14" font-weight="bold">?</text>
</svg>