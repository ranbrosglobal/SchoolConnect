<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#E3F2FD"/>
  
  <!-- Teacher body -->
  <ellipse cx="100" cy="140" rx="40" ry="50" fill="#1976D2"/>
  
  <!-- Teacher head -->
  <circle cx="100" cy="70" r="35" fill="#FFCC80"/>
  
  <!-- Hair -->
  <path d="M65 65 Q65 35 100 35 Q135 35 135 65" fill="#5D4037"/>
  
  <!-- Glasses -->
  <circle cx="85" cy="70" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="115" cy="70" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="93" y1="70" x2="107" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="70" r="3" fill="#333"/>
  <circle cx="115" cy="70" r="3" fill="#333"/>
  
  <!-- Smile -->
  <path d="M85 85 Q100 95 115 85" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Book -->
  <rect x="70" y="120" width="60" height="40" rx="5" fill="#F57C00"/>
  <rect x="75" y="125" width="50" height="30" rx="3" fill="#FFF"/>
  
  <!-- Book lines -->
  <line x1="80" y1="135" x2="120" y2="135" stroke="#DDD" stroke-width="2"/>
  <line x1="80" y1="142" x2="120" y2="142" stroke="#DDD" stroke-width="2"/>
  <line x1="80" y1="149" x2="120" y2="149" stroke="#DDD" stroke-width="2"/>
  
  <!-- Arms -->
  <path d="M60 130 Q40 120 35 100" fill="none" stroke="#1976D2" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 130 Q160 120 165 100" fill="none" stroke="#1976D2" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="35" cy="100" r="8" fill="#FFCC80"/>
  <circle cx="165" cy="100" r="8" fill="#FFCC80"/>
</svg>