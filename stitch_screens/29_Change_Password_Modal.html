<style>
        .bottom-sheet-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .bottom-sheet-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 300ms ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center font-body-lg text-body-lg text-on-background relative overflow-hidden">
<!-- Dimmed Background Overlay -->
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40"></div>
<!-- Bottom Sheet Modal -->
<div class="fixed bottom-0 left-0 right-0 md:relative md:w-full md:max-w-md bg-surface-container-lowest rounded-t-[24px] md:rounded-[24px] shadow-[0px_-8px_24px_rgba(35,38,53,0.1)] md:shadow-[0px_8px_24px_rgba(35,38,53,0.1)] z-50 flex flex-col bottom-sheet-enter-active">
<!-- Drag Handle (Mobile only) -->
<div class="w-full flex justify-center pt-xs pb-sm md:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-margin-mobile md:px-md pt-sm md:pt-md pb-md flex justify-between items-center border-b border-outline-variant/30">
<h2 class="font-headline-md text-headline-md text-on-surface">Change Password</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Form Content -->
<div class="p-margin-mobile md:p-md flex flex-col gap-sm overflow-y-auto max-h-[618px]">
<!-- Current Password -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="current_password">Current Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface placeholder:text-outline" id="current_password" placeholder="Enter current password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="flex flex-col gap-base mt-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="new_password">New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface placeholder:text-outline" id="new_password" placeholder="Enter new password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Inline Hint -->
<p class="font-body-sm text-body-sm text-outline flex items-center gap-base mt-1">
<span class="material-symbols-outlined text-[16px] text-tertiary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Must be at least 8 characters long.
                </p>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col gap-base mt-xs relative">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="confirm_password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface placeholder:text-outline" id="confirm_password" placeholder="Confirm new password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Doodle Accent pointing to button area -->
<div class="absolute -right-6 top-1/2 hidden md:block opacity-60">
<svg class="text-primary stroke-current" fill="none" height="40" viewbox="0 0 100 100" width="40" xmlns="http://www.w3.org/2000/svg">
<path d="M10 10 C 40 10, 60 50, 20 80" fill="none" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="2"></path>
<path d="M20 80 L 30 70 M20 80 L 10 70" fill="none" stroke-linecap="round" stroke-width="2"></path>
</svg>
<span class="font-doodle-note text-doodle-note text-primary absolute -bottom-6 -left-2 transform -rotate-12 whitespace-nowrap">Almost done!</span>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-margin-mobile md:p-md pt-0 md:pt-sm mt-auto border-t border-outline-variant/30 bg-surface-container-lowest/80 backdrop-blur-md rounded-b-[24px]">
<button class="w-full mt-sm py-sm px-md rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-md text-headline-md shadow-[0_4px_12px_rgba(49,69,187,0.2)] hover:opacity-90 hover:shadow-[0_6px_16px_rgba(49,69,187,0.3)] transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 relative overflow-hidden group">
<span class="relative z-10 flex items-center justify-center gap-xs">
                    Update Password
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
</span>
<!-- Subtle inner glow overlay -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-full mix-blend-overlay"></div>
</button>
<button class="w-full mt-xs py-sm px-md rounded-full bg-transparent text-primary font-headline-md text-headline-md hover:bg-primary/5 transition-colors duration-200">
                Cancel
            </button>
</div>
</div>
</body></html>
