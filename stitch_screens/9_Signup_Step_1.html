<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>School Connect - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#005f40",
                        "surface-variant": "#e1e2e5",
                        "on-surface-variant": "#454653",
                        "on-secondary-container": "#6a4600",
                        "tertiary-container": "#007a53",
                        "on-background": "#191c1e",
                        "surface-bright": "#f8f9fc",
                        "on-tertiary-fixed-variant": "#005236",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#000e5e",
                        "primary-container": "#4c5fd5",
                        "on-secondary-fixed": "#291800",
                        "background": "#f8f9fc",
                        "on-tertiary-fixed": "#002113",
                        "inverse-on-surface": "#f0f1f4",
                        "on-primary": "#ffffff",
                        "secondary-container": "#fdaf1e",
                        "primary": "#3145bb",
                        "secondary": "#815600",
                        "surface-tint": "#3f52c8",
                        "surface-dim": "#d9dadd",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e7e8eb",
                        "surface-container-highest": "#e1e2e5",
                        "surface": "#f8f9fc",
                        "on-primary-fixed-variant": "#2338af",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#7ff9c1",
                        "secondary-fixed-dim": "#ffba4b",
                        "on-error": "#ffffff",
                        "primary-fixed": "#dee0ff",
                        "inverse-primary": "#bbc3ff",
                        "secondary-fixed": "#ffddb1",
                        "surface-container-low": "#f2f3f6",
                        "tertiary-fixed-dim": "#61dca6",
                        "on-primary-container": "#eaeaff",
                        "on-tertiary-container": "#a3ffd0",
                        "outline": "#757685",
                        "surface-container": "#edeef1",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#bbc3ff",
                        "on-secondary-fixed-variant": "#624000",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2e3133",
                        "outline-variant": "#c5c5d6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "lg": "32px",
                        "md": "24px",
                        "sm": "16px",
                        "xs": "8px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "xl": "48px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "doodle-note": ["Kalam"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "doodle-note": ["16px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8F9FC;
        }
        .hairline-border {
            border: 1px solid #E2E8F0;
        }
        .soft-shadow {
            box-shadow: 0px 4px 12px rgba(35, 38, 53, 0.05);
        }
        .focus-glow:focus-within {
            border-color: #4C5FD5;
            box-shadow: 0 0 0 2px rgba(76, 95, 213, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-on-surface antialiased min-h-screen flex flex-col relative pb-32">
<!-- Top App Bar (Suppressing Navigation Shell as per mandate for transactional screens) -->
<header class="flex justify-between items-center w-full px-margin-mobile py-sm bg-surface-container-lowest hairline-border soft-shadow sticky top-0 z-10 md:px-margin-desktop">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface text-center flex-1">Create Account</h1>
<div class="flex items-center justify-end w-8">
<span class="material-symbols-outlined text-primary opacity-60 text-xl" data-icon="edit" style="transform: rotate(45deg);">edit</span>
</div>
</header>
<main class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile pt-lg md:px-0">
<!-- Progress Indicator -->
<div class="mb-lg">
<div class="flex justify-between items-end mb-xs">
<span class="font-doodle-note text-doodle-note text-primary">Step 1 of 4</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden flex">
<div class="w-1/4 bg-primary-container h-full rounded-full transition-all duration-500 ease-in-out relative">
<!-- Doodle checkmark for completed state logic would go here, currently on step 1 so no checkmark yet -->
</div>
</div>
</div>
<!-- Main Content Card -->
<div class="bg-surface-container-lowest rounded-[18px] hairline-border soft-shadow p-lg relative mb-xl">
<!-- Doodle Accent -->
<span class="material-symbols-outlined text-secondary-container absolute -top-4 -right-4 text-3xl transform rotate-12 opacity-80" data-icon="star">star</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md md:font-headline-lg md:text-headline-lg">Tell us about you</h2>
<form class="space-y-md">
<!-- Full Name -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="fullName">Full Name</label>
<div class="bg-surface-container-lowest hairline-border rounded-lg flex items-center px-sm py-xs focus-glow transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-xs opacity-70" data-icon="person">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface font-body-lg" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Email Address</label>
<div class="bg-surface-container-lowest hairline-border rounded-lg flex items-center px-sm py-xs focus-glow transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-xs opacity-70" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface font-body-lg" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Age Stepper -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">Age</label>
<div class="flex items-center gap-sm">
<button aria-label="Decrease age" class="w-10 h-10 rounded-full hairline-border bg-surface-container-lowest flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors hover:shadow-inner" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<div class="w-20 text-center font-headline-md text-headline-md text-on-surface">18</div>
<button aria-label="Increase age" class="w-10 h-10 rounded-full hairline-border bg-surface-container-lowest flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors hover:shadow-inner" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Location Fields Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- State -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="state">State / Province</label>
<div class="relative focus-glow rounded-lg">
<select class="w-full bg-surface-container-lowest hairline-border rounded-lg px-sm py-3 appearance-none focus:ring-0 text-on-surface font-body-lg border-[#E2E8F0]" id="state">
<option disabled="" selected="" value="">Select State</option>
<option value="ca">California</option>
<option value="ny">New York</option>
<option value="tx">Texas</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- City -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="city">City</label>
<div class="relative focus-glow rounded-lg">
<select class="w-full bg-surface-container-lowest hairline-border rounded-lg px-sm py-3 appearance-none focus:ring-0 text-on-surface font-body-lg border-[#E2E8F0]" id="city">
<option disabled="" selected="" value="">Select City</option>
<option value="la">Los Angeles</option>
<option value="sf">San Francisco</option>
<option value="sd">San Diego</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Country -->
<div class="flex flex-col gap-base pb-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="country">Country</label>
<div class="bg-surface-container-lowest hairline-border rounded-lg flex items-center px-sm py-xs focus-glow transition-all duration-200">
<span class="material-symbols-outlined text-on-surface-variant mr-xs opacity-70" data-icon="public">public</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface font-body-lg" id="country" placeholder="United States" type="text"/>
</div>
</div>
</form>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="fixed bottom-0 w-full bg-surface-container-lowest hairline-border soft-shadow px-margin-mobile py-sm z-50 md:px-margin-desktop md:flex md:justify-center border-t border-outline-variant rounded-t-[18px]">
<div class="w-full max-w-2xl relative">
<!-- Doodle Arrow Accent -->
<span class="material-symbols-outlined text-secondary absolute -top-8 right-8 text-3xl transform -rotate-45 hidden md:block" data-icon="south_east">south_east</span>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-md text-headline-md py-3 rounded-full hover:opacity-90 transition-opacity flex justify-center items-center gap-xs shadow-lg shadow-primary/20">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
