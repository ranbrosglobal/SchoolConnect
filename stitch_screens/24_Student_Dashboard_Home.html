<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }

        .sparkle-doodle {
            background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2C12 7.52285 7.52285 12 2 12C7.52285 12 12 16.4772 12 22C12 16.4772 16.4772 12 22 12C16.4772 12 12 7.52285 12 2Z' fill='%23fdaf1e'/%3E%3C/svg%3E");

            display: none;

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;

<style>
    body {

<body class="bg-background text-on-background font-body-lg antialiased pb-24">
<!-- TopAppBar (Web) -->
<header class="hidden md:flex justify-between items-center w-full px-margin-desktop py-md bg-primary shadow-sm bg-gradient-to-r from-primary to-primary-container z-40 sticky top-0">
<div class="flex items-center gap-sm">
<span class="text-headline-md font-headline-md font-bold text-on-primary">School Connect</span>
<div class="sparkle-doodle w-6 h-6 ml-2 inline-block"></div>
</div>
<nav class="flex gap-lg">
<a class="text-on-primary font-bold text-label-caps font-label-caps hover:opacity-90 transition-opacity flex flex-col items-center" href="#">
<span>HOME</span>
<div class="w-1.5 h-1.5 bg-secondary-container rounded-full mt-1"></div>
</a>
<a class="text-on-primary/70 text-label-caps font-label-caps hover:opacity-90 transition-opacity" href="#">ATTENDANCE</a>
<a class="text-on-primary/70 text-label-caps font-label-caps hover:opacity-90 transition-opacity" href="#">CLASSES</a>
<a class="text-on-primary/70 text-label-caps font-label-caps hover:opacity-90 transition-opacity" href="#">ALERTS</a>
</nav>
<div class="flex items-center gap-md">
<button class="text-on-primary hover:opacity-90 transition-opacity scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<div class="w-10 h-10 rounded-full border-2 border-on-primary overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small, high-quality, professional headshot photo of a young female student with dark hair, smiling warmly, brightly lit against a neutral light background. Modern corporate academic style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuALNf_R9cMwtjXUNwcvyHLf3ar_rYNoS_CFsJsyhpYjvG25-kTJ6kLgG5ZxmdM4nQxVCRFkmWPkQyIDnRb2dhe8KweCHsu9Q5H7t5NKk_OuQyWKTT2obPtYdSwMsfRuFzpKGc7oztfiuxQWJ6PPlL6T5Y09_BsxmBh8prAh8zuPZWIQQNcjdgTtXl_3tSW8GsPZXs4CUw69-UM3YuIqiIQMcQyFJqxheuodZKUiWHPQegXzhKp7n6uj"/>
</div>
</div>
</header>
<!-- Mobile Header (Custom for prompt) -->
<div class="md:hidden w-full px-margin-mobile pt-lg pb-xl bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-b-3xl shadow-sm relative overflow-hidden">
<!-- Decorative abstract shapes in header -->
<div class="absolute top-0 right-0 opacity-10 w-48 h-48 rounded-full border-[16px] border-white -translate-y-1/2 translate-x-1/4"></div>
<div class="flex justify-between items-start relative z-10">
<div>
<p class="text-body-sm text-on-primary/80 mb-1">September 24, 2024</p>
<div class="flex items-center">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile">Hi, Aria 👋</h1>
<div class="sparkle-doodle w-5 h-5 ml-2 animate-pulse"></div>
</div>
</div>
<div class="w-12 h-12 rounded-full border-2 border-on-primary/30 overflow-hidden shadow-sm">
<img class="w-full h-full object-cover" data-alt="A small, high-quality, professional headshot photo of a young female student with dark hair, smiling warmly, brightly lit against a neutral light background. Modern corporate academic style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVz7-hMQOeRdpplo7NzNW1x8KfLjzILNWBW5ppF4s2sZKdAtqX--xxla1lruBDP3yh2XWewJc4BZMxf3aSsuMxOMx4MFL1lH-LkdEdQwjRBuIHeETiFCIBnVw0249aMzLvk5vPIhUs6cyRn77NzaaA6YAzWDP0mUKAglqSqpWgwT8F37qIUTnA2FoBYLnFWi-pZmUiLYgs2bsZuVf1nvqrjUlm_4yhvojz5TTdP3mNd4r_yYjbPaNo"/>
</div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop py-md md:py-lg grid grid-cols-1 md:grid-cols-12 gap-md md:gap-lg -mt-md md:mt-0 relative z-10">
<!-- Overall Attendance Card (Bento-style main metric) -->
<section class="md:col-span-8 bg-surface-container-lowest rounded-[18px] border border-outline-variant p-md md:p-lg shadow-[0px_4px_12px_rgba(35,38,53,0.05)] relative overflow-hidden group">
<h2 class="text-label-caps font-label-caps text-on-surface-variant mb-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="data_usage">data_usage</span>
                OVERALL ATTENDANCE
            </h2>
<div class="flex flex-col md:flex-row items-center gap-lg justify-between">
<!-- Circular Progress -->
<div class="relative w-40 h-40 flex-shrink-0">
<svg class="w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-variant" cx="50" cy="50" fill="none" r="40" stroke-width="8"></circle>
<!-- 88% = 251.2 * 0.88 = 221.056 stroke-dashoffset = 251.2 - 221.056 = 30.144 -->
<circle class="stroke-primary" cx="50" cy="50" fill="none" r="40" stroke-dasharray="251.2" stroke-dashoffset="30.144" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="text-headline-lg font-headline-lg text-primary">88%</span>
</div>
</div>
<!-- Stats & Doodle -->
<div class="flex-1 w-full relative">
<div class="grid grid-cols-2 gap-sm mb-md">
<div class="bg-surface p-sm rounded-lg border border-outline-variant/50">
<p class="text-label-caps font-label-caps text-on-surface-variant">PRESENT</p>
<p class="text-headline-md font-headline-md text-tertiary-container mt-1">42 Days</p>
</div>
<div class="bg-surface p-sm rounded-lg border border-outline-variant/50">
<p class="text-label-caps font-label-caps text-on-surface-variant">ABSENT</p>
<p class="text-headline-md font-headline-md text-error mt-1">4 Days</p>
</div>
</div>
<!-- Hand-drawn annotation -->
<div class="absolute -top-12 md:-left-16 right-4 md:right-auto text-right md:text-left animate-bounce">
<p class="font-doodle-note text-doodle-note text-secondary-container transform rotate-3">5-day streak!</p>
<svg class="w-12 h-12 text-secondary-container absolute -bottom-8 right-8 md:left-8 transform md:-scale-x-100" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path class="stroke-dasharray-100 stroke-dashoffset-0" d="M10 10 C 30 30, 40 80, 80 90" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
<path d="M70 75 L 82 92 L 65 95" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container-lowest border-t border-outline-variant rounded-t-xl shadow-[0px_-4px_12px_rgba(35,38,53,0.05)] pb-6">
<!-- Dashboard (Active) -->
<a class="flex flex-col items-center justify-center text-primary relative after:content-[''] after:absolute after:-bottom-1 after:w-2 after:h-2 after:bg-secondary-container after:rounded-full scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined icon-fill mb-1 text-[24px]" data-icon="dashboard">dashboard</span>
<span class="text-label-caps font-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="assignment">assignment</span>
<span class="text-label-caps font-label-caps">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="analytics">analytics</span>
<span class="text-label-caps font-label-caps">Grades</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="text-label-caps font-label-caps">Profile</span>
</a>
</nav>
<script>
        // Simple script to handle bottom nav active states visually for demo
        document.querySelectorAll('nav.md\\:hidden a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                // Reset all
                document.querySelectorAll('nav.md\\:hidden a').forEach(l => {
                    l.className = "flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors";
                    l.querySelector('.material-symbols-outlined').classList.remove('icon-fill');
                });
                
                // Set active
                this.className = "flex flex-col items-center justify-center text-primary relative after:content-[''] after:absolute after:-bottom-1 after:w-2 after:h-2 after:bg-secondary-container after:rounded-full scale-90 transition-all duration-200";
                this.querySelector('.material-symbols-outlined').classList.add('icon-fill');
            });
        });
    </script>
</body></html>
