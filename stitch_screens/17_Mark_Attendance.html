<button class="bg-gradient-to-r from-primary to-surface-tint text-on-primary pl-6 pr-5 py-3 rounded-full text-body-lg font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-2 group relative overflow-hidden">
<span class="relative z-10">Save Attendance</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</div>
<!-- Minimal JS to handle the segmented control switching for demonstration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const groups = document.querySelectorAll('.attendance-group');
            
            const stateColors = {
                'P': 'bg-tertiary text-on-tertiary',
                'A': 'bg-error text-on-error',
                'H': 'bg-secondary text-on-secondary',
                'L': 'bg-primary text-on-primary'
            };

            const doodleSVGs = {
                'P': '<svg class="absolute -bottom-1 -right-1 w-5 h-5 text-current opacity-60 doodle-draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
                'A': '<svg class="absolute -bottom-1 -right-1 w-5 h-5 text-current opacity-70 doodle-draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
                'H': '<svg class="absolute -bottom-1 -right-1 w-5 h-5 text-current opacity-60 doodle-draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>',
                'L': '<svg class="absolute -bottom-1 -right-1 w-5 h-5 text-current opacity-60 doodle-draw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>'
            };

            groups.forEach(group => {
                const buttons = group.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // Reset all buttons in this group
                        buttons.forEach(b => {
                            b.className = 'w-10 h-10 rounded-md flex items-center justify-center text-body-lg font-body-lg font-bold text-on-surface-variant hover:bg-surface-container-highest hover:text-on-surface transition-colors option-btn';
                            // Remove SVGs
                            const svg = b.querySelector('svg');
                            if(svg) svg.remove();
                        });

                        // Apply active state
                        const state = btn.getAttribute('data-state');
                        btn.className = `w-10 h-10 rounded-md flex items-center justify-center text-body-lg font-body-lg font-bold transition-all relative shadow-sm option-btn ${stateColors[state]}`;
                        btn.innerHTML = state + doodleSVGs[state];
                        
                        // Note: In a real app, this would also update the row border color visually.
                    });
                });
            });
        });
    </script>
</body></html>
