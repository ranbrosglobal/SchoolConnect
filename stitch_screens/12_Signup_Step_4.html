<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>School Connect - Secure Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Kalam:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f0f1f4",
                        "primary-fixed": "#dee0ff",
                        "surface-container-low": "#f2f3f6",
                        "surface-container-high": "#e7e8eb",
                        "on-surface-variant": "#454653",
                        "surface-variant": "#e1e2e5",
                        "primary-fixed-dim": "#bbc3ff",
                        "primary": "#3145bb",
                        "secondary": "#815600",
                        "secondary-fixed-dim": "#ffba4b",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fdaf1e",
                        "outline-variant": "#c5c5d6",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "outline": "#757685",
                        "on-secondary-container": "#6a4600",
                        "surface-tint": "#3f52c8",
                        "surface": "#f8f9fc",
                        "inverse-primary": "#bbc3ff",
                        "on-secondary-fixed": "#291800",
                        "primary-container": "#4c5fd5",
                        "on-primary-fixed": "#000e5e",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#7ff9c1",
                        "inverse-surface": "#2e3133",
                        "surface-dim": "#d9dadd",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-container": "#eaeaff",
                        "surface-container": "#edeef1",
                        "surface-container-highest": "#e1e2e5",
                        "tertiary-fixed-dim": "#61dca6",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#2338af",
                        "tertiary": "#005f40",
                        "on-tertiary-container": "#a3ffd0",
                        "surface-bright": "#f8f9fc",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#ffddb1",
                        "on-tertiary-fixed": "#002113",
                        "on-background": "#191c1e",
                        "on-secondary-fixed-variant": "#624000",
                        "tertiary-container": "#007a53",
                        "background": "#f8f9fc",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "base": "4px",
                        "xl": "48px",
                        "gutter": "16px",
                        "md": "24px",
                        "lg": "32px",
                        "margin-desktop": "32px",
                        "xs": "8px",
                        "sm": "16px"
                    },
                    "fontFamily": {
                        "doodle-note": ["Kalam"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "doodle-note": ["16px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(49, 69, 187, 0.2);
            border-color: #3145bb;
        }
        .scribble-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%23C5C5D6' stroke-width='2' stroke-dasharray='8%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 12px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Container Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-[18px] border border-[#E2E8F0] shadow-[0px_4px_12px_rgba(35,38,53,0.05)] overflow-hidden relative">
<!-- Decorative Header / Progress -->
<div class="px-md pt-lg pb-md border-b border-[#E2E8F0] bg-surface-container-low/30 relative">
<div class="flex items-center justify-between mb-md">
<span class="font-label-caps text-label-caps text-on-surface-variant">STEP 4 OF 4</span>
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-full bg-tertiary/10 flex items-center justify-center relative">
<span class="font-label-caps text-label-caps text-tertiary">1</span>
<svg class="absolute -top-1 -right-1 w-4 h-4 text-tertiary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
</div>
<div class="w-8 h-8 rounded-full bg-tertiary/10 flex items-center justify-center relative">
<span class="font-label-caps text-label-caps text-tertiary">2</span>
<svg class="absolute -top-1 -right-1 w-4 h-4 text-tertiary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
</div>
<div class="w-8 h-8 rounded-full bg-tertiary/10 flex items-center justify-center relative">
<span class="font-label-caps text-label-caps text-tertiary">3</span>
<svg class="absolute -top-1 -right-1 w-4 h-4 text-tertiary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
</div>
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center border-2 border-primary">
<span class="font-label-caps text-label-caps text-primary">4</span>
</div>
</div>
</div>
<div class="flex items-center gap-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Secure your account</h1>
<!-- Doodle Lock -->
<svg class="w-8 h-8 text-secondary-container opacity-80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
<path d="M12 15v2" stroke-dasharray="2 2"></path>
</svg>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Create a strong password to protect your academic records.</p>
</div>
<!-- Form Content -->
<form class="p-md space-y-md" onsubmit="event.preventDefault();">
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface block" for="password">Password</label>
<div class="relative input-glow rounded-lg border border-[#E2E8F0] bg-surface-container-lowest transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant rounded-lg" id="password" placeholder="Enter password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" data-weight="regular">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="pt-sm space-y-2">
<div class="flex gap-2 h-1.5 w-full">
<div class="h-full flex-1 bg-error rounded-full transition-all duration-300"></div>
<div class="h-full flex-1 bg-secondary-container rounded-full transition-all duration-300 opacity-30"></div>
<div class="h-full flex-1 bg-tertiary rounded-full transition-all duration-300 opacity-30"></div>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Password strength: <span class="font-semibold text-error">Weak</span></span>
</div>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface block" for="confirm-password">Confirm Password</label>
<div class="relative input-glow rounded-lg border border-[#E2E8F0] bg-surface-container-lowest transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant rounded-lg" id="confirm-password" placeholder="Re-enter password" type="password"/>
</div>
</div>
<!-- Hand-drawn encouragement -->
<div class="flex items-center justify-end gap-2 pt-xs">
<span class="font-doodle-note text-doodle-note text-primary transform -rotate-2">Almost there!</span>
<svg class="w-6 h-6 text-primary transform rotate-45" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 12h14M12 5l7 7-7 7"></path>
</svg>
</div>
<!-- Submit Button -->
<div class="pt-sm pb-xs">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-md text-headline-md py-3 px-6 rounded-full shadow-[0_4px_14px_rgba(49,69,187,0.3)] hover:shadow-[0_6px_20px_rgba(49,69,187,0.4)] hover:opacity-90 transform hover:-translate-y-0.5 transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined" data-icon="arrow_forward" data-weight="regular">arrow_forward</span>
</button>
</div>
<div class="text-center">
<button class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-[#E2E8F0] underline-offset-4" type="button">
                    Back to previous step
                </button>
</div>
</form>
</main>
<!-- Top Left Doodle Accent -->
<svg class="absolute top-12 left-12 w-24 h-24 text-outline-variant/20 hidden md:block" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 100 100">
<path d="M20,50 Q40,20 60,50 T100,50"></path>
<path d="M30,30 Q50,60 70,30"></path>
</svg>
<!-- Bottom Right Doodle Accent -->
<svg class="absolute bottom-12 right-12 w-16 h-16 text-outline-variant/20 hidden md:block transform rotate-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="40" stroke-dasharray="10 5"></circle>
<path d="M50,20 L50,80 M20,50 L80,50" stroke-dasharray="5 5"></path>
</svg>
</body></html>
