[project]
name = "sc_auth"
authors = [
    { name = "School Connect" }
]
description = "Custom email/password authentication (login + signup) for the School Connect Flutter app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench]
installer = "flit"
